name: Build WABS Binaries

on:
  push:
    tags:
      - 'v*' # Automatically run when a tag starting with 'v' is pushed (e.g., v1.0.0-beta)
  release:
    types: [published] # Triggers when you publish a new Release in GitHub!
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows-latest
          - ubuntu-latest
          - ubuntu-22.04-arm

permissions:
  contents: write # Required to allow GitHub to attach files to the Release

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up matrix
        id: set-matrix
        env:
          TARGET_OS: ${{ inputs.target_os }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MATRIX_JSON='[
            {"os": "windows-latest", "artifact_name": "WABS-Windows.exe", "path_sep": ";", "icon_flag": "--icon=icon.ico"},
            {"os": "ubuntu-latest", "artifact_name": "WABS-Linux", "path_sep": ":", "icon_flag": ""},
            {"os": "ubuntu-22.04-arm", "artifact_name": "WABS-RaspberryPi", "path_sep": ":", "icon_flag": ""}
          ]'
          
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$TARGET_OS" != "all" ]]; then
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --arg target "$TARGET_OS" '[.[] | select(.os == $target)]')
          else
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c '.')
          fi
          
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gobject-introspection pkg-config libcairo2-dev python3-dev || sudo apt-get install -y libgirepository-2.0-dev gobject-introspection pkg-config libcairo2-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package with PyInstaller
        shell: bash
        env:
          # Pass the target artifact name to the spec file
          WABS_ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          pyinstaller WABS-Windows.exe.spec

      - name: Code Sign Windows Binary
        if: runner.os == 'Windows' && env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          # Decode base64 certificate to a temporary PFX file
          $certPath = [System.IO.Path]::Combine([System.IO.Path]::GetTempPath(), [System.IO.Path]::GetRandomFileName() + ".pfx")
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          
          # Find signtool.exe in Windows Kits
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          
          if ($signtool) {
              Write-Host "Signing executable: dist/${{ matrix.artifact_name }}"
              & $signtool sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/${{ matrix.artifact_name }}
          } else {
              Write-Error "signtool.exe not found in Windows Kits."
              exit 1
          }
          
          Remove-Item $certPath -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only runs if triggered by a tag
        with:
          files: dist/${{ matrix.artifact_name }}*

      - name: Upload Artifact for Manual Runs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*